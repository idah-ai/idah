service_name: iam
description: User, role, team management service

em:
  adapter: redis
plugins:
  - name: sentry
    config:
      dsn: <%= ENV["SENTRY_DSN"] %>
      environment: <%= ENV["SENTRY_ENVIRONMENT"] %> # empty: APP_ENVIRONMENT
      tracing: otel
      traces_sample_rate: <%= ENV.fetch("SENTRY_TRACES_SAMPLE_RATE", 0.0) %>
      profiles_sample_rate: <%= ENV.fetch("SENTRY_PROFILES_SAMPLE_RATE", 0.0) %>
      enable_logs: <%= ENV.fetch("SENTRY_ENABLE_LOGS", "false") == "true" %>
  - name: otel
    config:
      enabled: <%= !ENV["SENTRY_DSN"].to_s.empty? %>
      service_name_prefix: "idah-"
      instrumentations: [rack, sinatra, net_http, pg]
      db_statement: obfuscate
  - name: http
    config:
      show_error_details: <%= ENV.fetch("LOG_SHOW_ERROR_DETAILS", "true") %>
  - name: sequel
    config:
      mode: simple
      extensions:
        - pg_json
        - pg_array
        - pg_enum
      db:
        uri: <%= ENV.fetch("DATABASE_URI") %>
  - name: redis
    config:
      url: <%= ENV.fetch("REDIS_STREAM_URL") %>
      max_connections: 10
  - name: periodic

kv_store:
  adapter: Verse::Redis::KVStore
  config:
    plugin: :redis
    key_prefix: "iam:keys"

lock:
  adapter: Verse::Redis::Lock
  config:
    plugin: :redis
    key_prefix: "iam:locks"

counter:
  adapter: Verse::Redis::Counter
  config:
    plugin: :redis
    key_prefix: "iam:counters"

logging:
  level: <%= ENV.fetch("LOG_LEVEL", "info") %>

idah:
  # In-memory cache for ProjectMembership::Lookup (org_owner membership union).
  # Per-process LRU. Entries expire after a TTL (default 300s) so a missed
  # invalidation broadcast cannot leave stale authorization data indefinitely.
  project_membership_cache:
    enabled: <%= ENV.fetch("IDAH_PROJECT_MEMBERSHIP_CACHE_ENABLED", "true") == "true" %>
    # Seconds before an entry expires. Empty/unset gives the 300s default; a
    # value <= 0 is rejected at boot.
    ttl: <%= (ttl = ENV["IDAH_PROJECT_MEMBERSHIP_CACHE_TTL"]).to_s.empty? ? 300 : Integer(ttl).tap { |v| raise "IDAH_PROJECT_MEMBERSHIP_CACHE_TTL must be > 0 (got #{ttl})" if v <= 0 } %>
    capacity: <%= ENV.fetch("IDAH_PROJECT_MEMBERSHIP_CACHE_CAPACITY", 10000) %>

credentials:
  account: <%= ENV.fetch("IDAH_SERVICE_ACCOUNT") %>
  password: <%= ENV.fetch("IDAH_SERVICE_PASSWORD") %>
