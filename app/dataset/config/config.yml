service_name: dataset
description: Project, batches and annotation management service
em:
  adapter: redis
plugins:
  - name: sentry
    config:
      dsn: <%= ENV["SENTRY_DSN"] %>
      tracing: otel
      traces_sample_rate: <%= ENV.fetch("SENTRY_TRACES_SAMPLE_RATE", 1.0) %>
  - name: otel
    config:
      enabled: <%= !ENV["SENTRY_DSN"].to_s.empty? %>
      service_name_prefix: "idah-"
      instrumentations: [rack, sinatra, net_http, pg, concurrent_ruby]
      db_statement: obfuscate
  - name: http
    config:
      show_error_details: <%= ENV.fetch("LOG_SHOW_ERROR_DETAILS", "true") %>
  - name: sequel
    config:
      mode: simple
      extensions:
        - pg_json
        - pg_array
        - pg_enum
      db:
        uri: <%= ENV.fetch("DATABASE_URI") %>
  - name: redis
    config:
      url: <%= ENV.fetch("REDIS_STREAM_URL") %>
      max_connections: 10

kv_store:
  adapter: Verse::Redis::KVStore
  config:
    plugin: :redis
    key_prefix: "project:keys"

lock:
  adapter: Verse::Redis::Lock
  config:
    plugin: redis
    key_prefix: "project:locks"

counter:
  adapter: Verse::Redis::Counter
  config:
    plugin: redis
    key_prefix: "project:counters"

logging:
  level: <%= ENV.fetch("LOG_LEVEL", "info") %>

idah:
  plugins:
    # Path to load plugins from, supports glob patterns.
    path: <%= ENV.fetch("IDAH_PLUGIN_PATH", "plugins/**") %>

    # Auto reload modules when files change (only manual plugins)
    watch: <%= !!ENV["IDAH_DEV_PLUGIN"] %>

credentials:
  account: <%= ENV.fetch("IDAH_SERVICE_ACCOUNT") %>
  password: <%= ENV.fetch("IDAH_SERVICE_PASSWORD") %>
