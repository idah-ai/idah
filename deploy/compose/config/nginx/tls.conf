# HTTPS from your own certificate, served by IDAH's own nginx.
#
# Used when IDAH_TLS_CONF=./config/nginx/tls.conf in .env. Put the certificate and its key
# in config/certs, which nginx sees as /certs:
#
#   config/certs/idah.crt   the certificate, followed by any intermediates
#   config/certs/idah.key   its private key, not password-protected
#
# Then: docker compose up -d. The plain HTTP port keeps serving; set
# IDAH_HTTP_BIND=127.0.0.1 to keep it off the network.

server {
  listen 443 ssl;
  http2 on;

  ssl_certificate     /certs/idah.crt;
  ssl_certificate_key /certs/idah.key;

  # TLS 1.2 and 1.3 only, with the cipher choice left to the client's order for
  # 1.3. Older protocols are refused.
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  include /etc/nginx/routes.conf;
}
