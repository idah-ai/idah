# No HTTPS: IDAH serves plain HTTP only, and TLS is terminated in front of it,
# or not used at all. This file is mounted into nginx when IDAH_TLS_CONF is not
# set, and deliberately contains nothing.
#
# To serve HTTPS from IDAH's own nginx instead, see tls.conf beside this file
# and IDAH_TLS_CONF
# in .env.example.
