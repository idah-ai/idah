events {
  worker_connections 1024;
}

http {
  # Re-resolve service names through Docker's DNS. Recreating a container gives
  # it a new address; without this nginx keeps the one it resolved at startup
  # and routes to whichever container now holds it.
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream iam_service {
    zone iam_service 64k;
    server iam:3000 resolve;
  }

  upstream media_service {
    zone media_service 64k;
    server media:3000 resolve;
  }

  upstream setting_service {
    zone setting_service 64k;
    server setting:3000 resolve;
  }

  upstream dataset_service {
    zone dataset_service 64k;
    server dataset:3000 resolve;
  }

  upstream audit_service {
    zone audit_service 64k;
    server audit:3000 resolve;
  }

  upstream sync_service {
    zone sync_service 64k;
    server sync:3000 resolve;
  }

  upstream notification_service {
    zone notification_service 64k;
    server notification:3000 resolve;
  }

  upstream frontend_service {
    zone frontend_service 64k;
    server frontend:3000 resolve;
  }

  map $http_upgrade $connection_upgrade {
          default upgrade;
          ''      close;
      }

  # Plain HTTP. Serves on its own, and is also where a TLS terminator in front
  # of IDAH (a load balancer or your own reverse proxy) forwards to: the
  # X-Forwarded-* headers in routes.conf carry the original scheme and host.
  server {
    listen 80;

    include /etc/nginx/routes.conf;
  }

  # Serving HTTPS from your own certificate: see IDAH_TLS_CONF in .env.example.
  # Without it this file is empty.
  include /etc/nginx/tls/*.conf;
}
