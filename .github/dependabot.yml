# Weekly dependency update pull requests.
#
# Minor and patch updates are grouped into one pull request per ecosystem, so a
# week brings a handful of PRs, not dozens. Major updates still arrive one at a
# time, since each may need code changes. Titles follow the commit convention
# in CONTRIBUTING.md: "build: bump …", or "ci: bump …" for workflow actions.

version: 2

updates:
  # The seven Ruby services, the shared library and the plugin backends.
  - package-ecosystem: bundler
    directories:
      - /app/audit
      - /app/dataset
      - /app/iam
      - /app/media
      - /app/notification
      - /app/setting
      - /app/sync
      - /common
      - /plugins/idah-image/backends
      - /plugins/idah-video/backends
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
    groups:
      ruby:
        update-types: [minor, patch]

  # The frontend and the plugin frontends.
  - package-ecosystem: npm
    directories:
      - /app/frontend
      - /plugins/idah-image/frontend
      - /plugins/idah-video/frontend
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
    groups:
      javascript:
        update-types: [minor, patch]

  # Base images of the published Dockerfiles.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build

  # Actions used by the workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        update-types: [minor, patch]
