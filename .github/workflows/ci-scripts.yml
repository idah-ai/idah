# Scripts CI workflow
#
# Checks the release and install scripts when a pull request or a merge to main
# changes them:
#
#   lint       shellcheck on every script, and bin/tag-release's tests
#   installer  builds the three images from the change, builds the
#              installer bundle, and installs it as a customer would, then
#              again with a first attempt that fails part-way
#
# The upgrade from the previous release needs published images, so it runs in
# CD - App on every version tag instead.

name: CI - Scripts

on:
  pull_request:
    types:
      - ready_for_review
      - synchronize
      - opened
      - reopened

  # Every merge too: a pull request is tested against main as it was when its
  # checks ran, and other merges may have landed since. On main the path
  # filters compare with the commit before the merge.
  push:
    branches:
      - main

# A newer push to a pull request cancels its older run. On main each commit
# gets its own group, so every merge is tested in full.
concurrency:
  group: ${{ github.head_ref || github.sha }}-scripts
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    outputs:
      scripts: ${{ steps.filter.outputs.scripts }}
      installer: ${{ steps.filter.outputs.installer }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            scripts:
              - 'bin/tag-release*'
              - 'deploy/compose/install.sh'
              - 'deploy/compose/install/**'
              - '.github/scripts/**'
              - '.github/workflows/ci-scripts.yml'
            installer:
              - 'deploy/compose/**'
              - '.github/scripts/build-bundle.sh'
              - '.github/scripts/test-installer.sh'
              - '.github/workflows/ci-scripts.yml'

  lint:
    name: Lint and test scripts
    if: ${{ needs.changes.outputs.scripts == 'true' }}
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Warnings and errors; shellcheck's style hints are left to review.
      # --external-sources lets shellcheck read the installer's steps in install/
      # where install.sh sources them.
      - name: Run shellcheck
        run: |
          shellcheck --severity=warning --external-sources \
            bin/tag-release bin/tag-release.test.sh \
            deploy/compose/install.sh deploy/compose/install/*.sh \
            .github/scripts/*.sh

      - name: Test bin/tag-release
        run: bin/tag-release.test.sh

  installer:
    name: Install from the bundle
    if: ${{ needs.changes.outputs.installer == 'true' }}
    needs: changes
    runs-on: ubuntu-24.04
    env:
      VERSION: 0.0.0-ci
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Tagged idah-<image>:0.0.0-ci, so the install uses them instead of
      # pulling: IDAH_IMAGE_PREFIX=idah- below. Service and frontend are cached:
      # a pull request reuses its own earlier runs and main's, so a push that
      # leaves the app alone skips most of the build.
      - name: Build the service image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.service
          build-args: IDAH_VERSION=${{ env.VERSION }}
          tags: idah-service:${{ env.VERSION }}
          load: true
          cache-from: type=gha,scope=ci-installer-service
          cache-to: type=gha,mode=max,scope=ci-installer-service

      # Built with Docker's own builder: it starts FROM the service image just
      # loaded, which the caching builder above cannot see. One layer, quick.
      - name: Build the media image
        run: |
          docker buildx build --builder default --load -f docker/Dockerfile.media \
            -t "idah-media:$VERSION" --build-arg SERVICE_IMAGE="idah-service:$VERSION" .

      - name: Build the frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.frontend
          build-args: IDAH_VERSION=${{ env.VERSION }}
          tags: idah-frontend:${{ env.VERSION }}
          load: true
          cache-from: type=gha,scope=ci-installer-frontend
          cache-to: type=gha,mode=max,scope=ci-installer-frontend

      - name: Build the bundle
        run: .github/scripts/build-bundle.sh "$VERSION" dist

      - name: Install as a customer would
        env:
          IDAH_IMAGE_PREFIX: idah-
        run: .github/scripts/test-installer.sh install "dist/idah-$VERSION"

      - name: Retry an install that failed part-way
        env:
          IDAH_IMAGE_PREFIX: idah-
        run: .github/scripts/test-installer.sh retry "dist/idah-$VERSION"

  # The one check branch protection requires. The workflow runs on every PR and
  # the jobs above skip themselves when their paths did not change, so this job
  # always reports: skipped counts as passed, failed or cancelled does not.
  passed:
    name: Scripts CI passed
    if: ${{ always() }}
    needs: [changes, lint, installer]
    runs-on: ubuntu-24.04
    steps:
      - name: Check every job's result
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if jq -e 'any(.[]; . == "failure" or . == "cancelled")' <<< "$RESULTS" > /dev/null; then
            echo "::error::A job failed or was cancelled."
            exit 1
          fi
