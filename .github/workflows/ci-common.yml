# Common library CI workflow
#
# Runs the specs of the shared library when common/ changes. The services that
# load common/ are re-tested by ci-app.yml, which also watches common/**.

name: CI - Common

on:
  pull_request:
    types:
      - ready_for_review
      - synchronize
      - opened
      - reopened

  # Every merge too: a pull request is tested against main as it was when its
  # checks ran, and other merges may have landed since. On main the path
  # filters compare with the commit before the merge.
  push:
    branches:
      - main

env:
  COMMON_DIR: ./common

# A newer push to a pull request cancels its older run. On main each commit
# gets its own group, so every merge is tested in full.
concurrency:
  group: ${{ github.head_ref || github.sha }}-common
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    outputs:
      common: ${{ steps.filter.outputs.common }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            common:
              - '${{ env.COMMON_DIR }}/**'
              - .github/workflows/ci-common.yml

  common:
    name: Common Library
    if: ${{ needs.changes.outputs.common == 'true' }}
    needs: changes
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ env.COMMON_DIR }}
    services:
      postgres:
        image: postgres:17
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          # runs 'bundle install' and caches installed gems automatically
          bundler-cache: true
          working-directory: ${{ env.COMMON_DIR }}

      # Runs spec/ only: the *_spec.rb files under lib/ do not load in this suite yet.
      - name: Run RSpec
        run: LOG_LEVEL=error bundle exec rspec --fail-fast
        env:
          CI: true

      # Coverage is reported, not gated: common/ sits below the 90% service minimum.
      - name: Upload Code Coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: common-code-coverage
          path: ${{ env.COMMON_DIR }}/coverage

  # The one check branch protection requires. The workflow runs on every PR and
  # the jobs above skip themselves when their paths did not change, so this job
  # always reports: skipped counts as passed, failed or cancelled does not.
  passed:
    name: Common CI passed
    if: ${{ always() }}
    needs: [changes, common]
    runs-on: ubuntu-24.04
    steps:
      - name: Check every job's result
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if jq -e 'any(.[]; . == "failure" or . == "cancelled")' <<< "$RESULTS" > /dev/null; then
            echo "::error::A job failed or was cancelled."
            exit 1
          fi
