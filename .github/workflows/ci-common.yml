# Common library CI workflow
#
# Runs the specs of the shared library in common/. The services that load
# common/ are re-tested by ci-app.yml, which also triggers on common/**.

name: CI - Common

on:
  pull_request:
    paths:
      - "common/**"
      - ".github/workflows/ci-common.yml"
    types:
      - ready_for_review
      - synchronize
      - opened
      - reopened

env:
  COMMON_DIR: ./common

concurrency:
  group: ${{ github.head_ref }}-common
  cancel-in-progress: true

jobs:
  common:
    name: Common Library
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.COMMON_DIR }}
    services:
      postgres:
        image: postgres:17
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          # runs 'bundle install' and caches installed gems automatically
          bundler-cache: true
          working-directory: ${{ env.COMMON_DIR }}

      # Runs spec/ only: the *_spec.rb files under lib/ do not load in this suite yet.
      - name: Run RSpec
        run: LOG_LEVEL=error bundle exec rspec --fail-fast
        env:
          CI: true

      # Coverage is reported, not gated: common/ sits below the 90% service minimum.
      - name: Upload Code Coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: common-code-coverage
          path: ${{ env.COMMON_DIR }}/coverage
