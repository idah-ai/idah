# The IDAH development stack.
#
# The seven Ruby services all run one image: the `dev` stage of
# docker/Dockerfile.service, the Dockerfile the published images are built from.
# Each service mounts its own directory and gems over it. The frontend runs the
# `dev` stage of docker/Dockerfile.frontend the same way.
#
# config/development/.env says how the containers reach PostgreSQL and Redis;
# each service reads its own settings from app/<service>/.env.development.
# Postgres, Redis, the vite frontend, TLS on idah.localhost and MailHog run here
# too.
#
# Postgres and Redis run as containers by default. To use the ones on your
# machine instead, set these in a root .env file (see .env.example):
#   IDAH_POSTGRES_HOST=host.docker.internal
#   IDAH_POSTGRES_CONTAINER=0
#   IDAH_REDIS_HOST=host.docker.internal
#   IDAH_REDIS_CONTAINER=0
#
# Your own changes belong in a compose.override.yml next to this file, which
# `docker compose` merges over this one automatically and git ignores (see
# DEVELOPMENT_GUIDE.md).
#
# An on-premise install does not use this file. It uses the release bundle in
# deploy/compose/, which pulls published images and reads a single .env.

# The Ruby services wait for the database containers when they run, and start
# without them when they are switched off.
x-dev-databases: &dev-databases
  postgres:
    condition: service_healthy
    required: false
  redis:
    condition: service_healthy
    required: false

# What every Ruby service has in common. Each one adds its own volumes and
# Sentry DSN.
x-ruby-service: &ruby-service
  image: idah-service:dev
  build:
    context: .
    dockerfile: ./docker/Dockerfile.service
    target: dev
  env_file:
    - config/development/.env
  depends_on: *dev-databases
  ports:
    - "3000"
  networks:
    - app-network
  extra_hosts:
    - "host.docker.internal:host-gateway"
    - "idah.localhost:host-gateway"
  stdin_open: true
  tty: true

services:
  nginx:
    image: nginx:1.30.5-alpine
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./config/development/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/development/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - media
      - dataset
      - iam
      - setting
      - audit
      - sync
      - notification
      - mails
    networks:
      - app-network

  postgres:
    image: postgres:17
    scale: ${IDAH_POSTGRES_CONTAINER:-1}
    # POSTGRES_USER and POSTGRES_PASSWORD, shared with the services.
    env_file:
      - config/development/.env
    environment:
      POSTGRES_DB: postgres
    ports:
      - "${IDAH_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  redis:
    image: redis:8.10.2
    scale: ${IDAH_REDIS_CONTAINER:-1}
    command: redis-server --appendonly yes
    ports:
      - "${IDAH_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  iam:
    <<: *ruby-service
    environment:
      SENTRY_DSN: ${SENTRY_DSN_IAM:-}
    volumes:
      - ./app/iam:/app
      - ./common:/common
      - ./config/development/ssl/cert.pem:/etc/ssl/certs/ca-certificates.crt
      - iam_bundler_cache:/usr/local/bundle

  media:
    <<: *ruby-service
    depends_on:
      <<: *dev-databases
      dataset:
        condition: service_started
    environment:
      SENTRY_DSN: ${SENTRY_DSN_MEDIA:-}
    volumes:
      - ./app/media:/app
      - ./common:/common
      - ./plugins:/plugins
      - ./plugins_dev:/plugins_dev
      - media_bundler_cache:/usr/local/bundle

  dataset:
    <<: *ruby-service
    environment:
      SENTRY_DSN: ${SENTRY_DSN_DATASET:-}
    volumes:
      - ./app/dataset:/app
      - ./common:/common
      - ./plugins:/plugins
      - ./plugins_dev:/plugins_dev
      - ./config/development/ssl/cert.pem:/etc/ssl/certs/ca-certificates.crt
      - dataset_bundler_cache:/usr/local/bundle

  setting:
    <<: *ruby-service
    environment:
      SENTRY_DSN: ${SENTRY_DSN_SETTING:-}
    volumes:
      - ./app/setting:/app
      - ./common:/common
      - ./plugins:/plugins
      - ./plugins_dev:/plugins_dev
      - setting_bundler_cache:/usr/local/bundle

  audit:
    <<: *ruby-service
    environment:
      SENTRY_DSN: ${SENTRY_DSN_AUDIT:-}
    volumes:
      - ./app/audit:/app
      - ./common:/common
      - ./config/development/ssl/cert.pem:/etc/ssl/certs/ca-certificates.crt
      - audit_bundler_cache:/usr/local/bundle

  sync:
    <<: *ruby-service
    environment:
      SENTRY_DSN: ${SENTRY_DSN_SYNC:-}
    volumes:
      - ./app/sync:/app
      - ./common:/common
      - ./plugins:/plugins
      - ./plugins_dev:/plugins_dev
      - ./config/development/ssl/cert.pem:/etc/ssl/certs/ca-certificates.crt
      - sync_bundler_cache:/usr/local/bundle

  notification:
    <<: *ruby-service
    environment:
      SENTRY_DSN: ${SENTRY_DSN_NOTIFICATION:-}
    volumes:
      - ./app/notification:/app
      - ./common:/common
      - ./config/development/ssl/cert.pem:/etc/ssl/certs/ca-certificates.crt
      - notification_bundler_cache:/usr/local/bundle

  frontend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.frontend
      target: dev
    environment:
      PUBLIC_SENTRY_DSN: ${SENTRY_DSN_FRONTEND:-}
    ports:
      - "5173"
    volumes:
      - ./app/frontend:/app/frontend
      - node_modules:/app/frontend/node_modules
    networks:
      - app-network
    stdin_open: true
    tty: true

  mails:
    image: mailhog/mailhog
    platform: linux/amd64
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "idah.localhost:host-gateway"
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  # Same names as the former docker-compose-db.yml, so existing data is kept.
  postgres_data:
  redis_data:
  iam_bundler_cache:
  media_bundler_cache:
  dataset_bundler_cache:
  setting_bundler_cache:
  audit_bundler_cache:
  sync_bundler_cache:
  notification_bundler_cache:
  node_modules:
