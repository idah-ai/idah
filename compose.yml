# The IDAH stack, built from source: the developer and CI base.
#
# `docker compose` merges compose.override.yml over this file automatically,
# which adds the development setup and the settings in config/development/.
# On its own this file only builds and wires the services; it carries no
# settings, so `docker compose -f compose.yml up` does not start a usable stack.
#
# An on-premise install does not use these files. It uses the release bundle in
# deploy/, which pulls published images and reads a single .env.

services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    depends_on:
      - frontend
      - media
      - dataset
      - iam
      - setting
      - audit
      - sync
      - notification
    networks:
      - app-network

  iam:
    build:
      context: .
      dockerfile: ./app/iam/Dockerfile
    ports:
      - "3000"
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  media:
    build:
      context: .
      dockerfile: ./app/media/Dockerfile
    ports:
      - "3000"
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - dataset

  dataset:
    build:
      context: .
      dockerfile: ./app/dataset/Dockerfile
    ports:
      - "3000"
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  setting:
    build:
      context: .
      dockerfile: ./app/setting/Dockerfile
    ports:
      - "3000"
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  audit:
    build:
      context: .
      dockerfile: ./app/audit/Dockerfile
    ports:
      - "3000"
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  sync:
    build:
      context: .
      dockerfile: ./app/sync/Dockerfile
    ports:
      - "3000"
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  notification:
    build:
      context: .
      dockerfile: ./app/notification/Dockerfile
    ports:
      - "3000"
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: .
      dockerfile: ./app/frontend/Dockerfile
      args:
        VITE_IDAH_HOST: ${VITE_IDAH_HOST:-http://localhost:8080}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    ports:
      - "3000"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
