# The IDAH development stack.
#
# `docker compose` merges compose.override.yml over this file automatically,
# which adds the development setup and the settings in config/development/.
# On its own this file only builds and wires the services; it carries no
# settings, so `docker compose -f compose.yml up` does not start a usable stack.
#
# The seven Ruby services all run one image: the `dev` stage of
# docker/Dockerfile.service, the Dockerfile the published images are built from.
# Each service mounts its own directory and gems over it. The frontend runs the
# `dev` stage of docker/Dockerfile.frontend the same way.
#
# An on-premise install does not use these files. It uses the release bundle in
# deploy/compose/, which pulls published images and reads a single .env.

x-service-build: &service-build
  context: .
  dockerfile: ./docker/Dockerfile.service
  target: dev

services:
  nginx:
    image: nginx:1.30.5-alpine
    ports:
      - "8080:80"
    depends_on:
      - frontend
      - media
      - dataset
      - iam
      - setting
      - audit
      - sync
      - notification
    networks:
      - app-network

  iam:
    image: idah-service:dev
    build: *service-build
    ports:
      - "3000"
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  media:
    image: idah-service:dev
    build: *service-build
    ports:
      - "3000"
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - dataset

  dataset:
    image: idah-service:dev
    build: *service-build
    ports:
      - "3000"
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  setting:
    image: idah-service:dev
    build: *service-build
    ports:
      - "3000"
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  audit:
    image: idah-service:dev
    build: *service-build
    ports:
      - "3000"
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  sync:
    image: idah-service:dev
    build: *service-build
    ports:
      - "3000"
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  notification:
    image: idah-service:dev
    build: *service-build
    ports:
      - "3000"
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.frontend
      target: dev
    environment:
      PUBLIC_SENTRY_DSN: ${SENTRY_DSN_FRONTEND:-}
    ports:
      - "3000"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
